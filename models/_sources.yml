version: 2
# ClickHouse reads the shared Iceberg tables in place through iceberg() views (created on-run-start from vars.iceberg_locations).
# Source names kept from the other consumers for a like-for-like lineage comparison.
# `physical_identity` is the engine-independent name the lineage stitcher joins on — identical to what the other engines declare.
sources:
  - name: stock_common_ch           # PRODUCED BY ATHENA — ClickHouse is the 3rd consumer (Snowflake 1st, Databricks 2nd)
    database: stock_common_mesh
    schema: stock_common_mesh
    meta: {engine: clickhouse, produced_by_engine: athena, physical_format: iceberg}
    tables:
      - name: common_price_daily
        meta: {physical_identity: "glue:stock_common_mesh.common_price_daily"}
      - name: common_ticker
        meta: {physical_identity: "glue:stock_common_mesh.common_ticker"}
      - name: common_exchange
        meta: {physical_identity: "glue:stock_common_mesh.common_exchange"}
  - name: stock_consumer_sf_ch      # PRODUCED BY SNOWFLAKE (Snowflake-managed Iceberg) — read directly from S3 by ClickHouse
    database: stock_consumer_mesh
    schema: stock_consumer_mesh
    meta: {engine: clickhouse, produced_by_engine: snowflake, physical_format: iceberg}
    tables:
      - name: mart_price_monthly_usd
        meta: {physical_identity: "snowflake:datapai.stock_consumer_mesh.mart_price_monthly_usd"}
